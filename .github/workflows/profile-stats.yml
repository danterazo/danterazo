name: Refresh profile cards

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/profile-stats.yml
      - scripts/recent-activity.mjs

permissions:
  contents: read

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Generate weekly and monthly activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: node scripts/recent-activity.mjs

      - name: Generate light rolling activity
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=danterazo&theme=default&title_color=187466&icon_color=187466&hide_rank=true&show_icons=true&include_all_commits=false&hide=stars,prs,issues&number_format=long&disable_animations=true&card_width=495&custom_title=GitHub%20Activity%20%28Last%2012%20Months%29
          path: profile/rolling-light.svg
          core_version: "2.2.1"
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark rolling activity
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=danterazo&theme=github_dark&title_color=70d9bd&icon_color=70d9bd&hide_rank=true&show_icons=true&include_all_commits=false&hide=stars,prs,issues&number_format=long&disable_animations=true&card_width=495&custom_title=GitHub%20Activity%20%28Last%2012%20Months%29
          path: profile/rolling-dark.svg
          core_version: "2.2.1"
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light overview
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=danterazo&theme=default&title_color=187466&icon_color=187466&hide_rank=true&show_icons=true&include_all_commits=true&hide=contribs&show=contributions&number_format=long&disable_animations=true&card_width=495&custom_title=GitHub%20Overview%20%28All%20Time%29
          path: profile/stats-light.svg
          core_version: "2.2.1"
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark overview
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: stats
          options: username=danterazo&theme=github_dark&title_color=70d9bd&icon_color=70d9bd&hide_rank=true&show_icons=true&include_all_commits=true&hide=contribs&show=contributions&number_format=long&disable_animations=true&card_width=495&custom_title=GitHub%20Overview%20%28All%20Time%29
          path: profile/stats-dark.svg
          core_version: "2.2.1"
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light language breakdown
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: username=danterazo&theme=default&title_color=187466&layout=compact&langs_count=8&card_width=495&disable_animations=true&custom_title=Languages%20Across%20Public%20Repos
          path: profile/languages-light.svg
          core_version: "2.2.1"
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark language breakdown
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: username=danterazo&theme=github_dark&title_color=70d9bd&layout=compact&langs_count=8&card_width=495&disable_animations=true&custom_title=Languages%20Across%20Public%20Repos
          path: profile/languages-dark.svg
          core_version: "2.2.1"
          fail_on_error: "true"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light contribution streak
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1
        with:
          options: user=danterazo&theme=default&ring=187466&fire=187466&currStreakLabel=187466&disable_animations=true&card_width=495
          path: profile/streak-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark contribution streak
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1
        with:
          options: user=danterazo&theme=github-dark&ring=70d9bd&fire=70d9bd&currStreakLabel=70d9bd&disable_animations=true&card_width=495
          path: profile/streak-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh profile statistics"
          git push
